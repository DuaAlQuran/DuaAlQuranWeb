<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدعية القرآن الكريم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link
            href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@200;300;400;500;600;700;800;900&family=Scheherazade+New:wght@400;500;600;700&display=swap"
            rel="stylesheet">
    <style>
        /* ================== الأساسيات والمتغيرات ================== */
        :root {
            --cosmic-deep: #0a0a23;
            --cosmic-blue: #1a1a5a;
            --cosmic-purple: #2d1b69;
            --cosmic-pink: #ff6b9d;
            --cosmic-gold: #ffd700;
            --text-white: #ffffff;
            --accent-blue: #00d4ff;
            --accent-purple: #d400ff;
            --cosmic-glow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            font-family: 'Cairo', 'Amiri', serif;
            background: var(--cosmic-deep);
            color: var(--text-white);
            position: relative;
        }

        /* Prevent horizontal scrolling with proper responsive fixes */
        .cosmic-container,
        .cosmic-grid,
        .cosmic-search,
        .cosmic-modal-content {
            max-width: 100%;
            box-sizing: border-box;
        }

        /* ================== تحسينات إمكانية الوصول ================== */
        /* تعطيل الرسوم المتحركة للمستخدمين الذين يفضلون تقليل الحركة */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }


            .cosmic-title,
            .cosmic-subtitle {
                background: var(--cosmic-gold) !important;
                -webkit-background-clip: unset !important;
                -webkit-text-fill-color: unset !important;
                animation: none !important;
            }
        }








        /* ================== الهيدر  ================== */
        .cosmic-header {
            position: relative;
            background: linear-gradient(135deg,
                    rgba(10, 10, 35, 0.9) 0%,
                    rgba(45, 27, 105, 0.8) 50%,
                    rgba(26, 26, 90, 0.9) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding: 30px 20px;
            text-align: center;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .cosmic-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><g fill="none" fill-rule="evenodd"><g fill="%23ffffff" fill-opacity="0.05"><circle cx="30" cy="30" r="2"/></g></svg>');
            animation: patternMove 20s linear infinite;
        }

        @keyframes patternMove {
            0% {
                transform: translateX(0) translateY(0);
            }

            100% {
                transform: translateX(60px) translateY(60px);
            }
        }

        .cosmic-title {
            font-family: 'Scheherazade New', 'Amiri', serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(45deg,
                    var(--cosmic-gold) 0%,
                    var(--text-white) 25%,
        var(--accent-blue) 50%,
                    var(--cosmic-pink) 75%,
                    var(--cosmic-gold) 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: cosmicTextShimmer 4s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        @keyframes cosmicTextShimmer {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .cosmic-subtitle {
            font-size: 1.3rem;
            color: var(--accent-blue);
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            animation: subtitleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes subtitleGlow {
            0% {
                color: var(--accent-blue);
                text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            }

            100% {
                color: var(--accent-blue);
                text-shadow: 0 0 20px rgba(0, 255, 136, 0.7);
            }
        }

        /* ================== البحث  ================== */
        .cosmic-search {
            position: relative;
            max-width: 600px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            padding: 8px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .cosmic-search::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 215, 0, 0.2) 50%,
                    transparent 100%);
            animation: searchShimmer 3s ease-in-out infinite;
        }

        @keyframes searchShimmer {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .cosmic-search input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
            background: transparent;
            color: var(--text-white);
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif;
            outline: none;
            position: relative;
            z-index: 2;
        }

        .cosmic-search input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .cosmic-search button {
            padding: 12px 25px;
            background: linear-gradient(45deg,
                    var(--cosmic-gold) 0%,
        var(--accent-blue) 100%);
            border: none;
            border-radius: 50px;
            color: var(--text-white);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .cosmic-search button:hover {
            background: linear-gradient(45deg,
        var(--accent-blue) 0%,
                    var(--cosmic-pink) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
        }

        /* ================== زر جامع الدعاء الكوني ================== */
        .collective-prayer-cosmic {
            text-align: center;
            margin-top: 20px;
        }

        .collective-btn-cosmic {
            padding: 15px 40px;
            background: linear-gradient(135deg,
                    var(--cosmic-purple) 0%,
        var(--accent-purple) 50%,
                    var(--cosmic-pink) 100%);
            border: none;
            border-radius: 30px;
            color: var(--text-white);
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow:
                0 8px 30px rgba(212, 0, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .collective-btn-cosmic::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.3) 50%,
                    transparent 100%);
            transition: left 0.5s ease;
        }

        .collective-btn-cosmic:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow:
                0 15px 50px rgba(212, 0, 255, 0.6),
                0 0 40px rgba(255, 107, 157, 0.5);
            background: linear-gradient(135deg,
        var(--accent-purple) 0%,
                    var(--cosmic-pink) 50%,
                    var(--cosmic-gold) 100%);
        }

        .collective-btn-cosmic:hover::before {
            left: 100%;
        }

        /* ================== الحاوي الرئيسي ================== */
        .cosmic-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            position: relative;
        }

        /* ================== شبكة البطاقات الكونية ================== */
        .cosmic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        /* ================== بطاقة الدعاء الكونية ================== */
        .cosmic-dua-card {
            position: relative;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.1) 0%,
                    rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 25px;
            padding: 30px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 30px rgba(255, 215, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            cursor: pointer;
        }

        .cosmic-dua-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg,
                    rgba(255, 215, 0, 0.1) 0%,
                    transparent 25%,
                    rgba(0, 212, 255, 0.1) 50%,
                    transparent 75%,
                    rgba(212, 0, 255, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .cosmic-dua-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.4),
                0 0 50px rgba(255, 215, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
        }

        .cosmic-dua-card:hover::before {
            opacity: 1;
        }

        .cosmic-dua-text {
            font-family: 'Scheherazade New', 'Amiri', serif;
            font-size: 1.6rem;
            line-height: 2;
            color: var(--text-white);
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
            text-shadow:
                0 2px 15px rgba(0, 0, 0, 0.8),
                0 0 25px rgba(255, 255, 255, 0.3),
                0 4px 20px rgba(0, 0, 0, 0.6);
            animation: textGlow 4s ease-in-out infinite alternate;
            background: rgba(0, 0, 0, 0.15);
            padding: 12px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            }

            100% {
                text-shadow:
                    0 2px 10px rgba(0, 0, 0, 0.5),
                    0 0 20px rgba(255, 215, 0, 0.3);
            }
        }

        /* ================== أزرار الإجراءات الكونية ================== */
        .cosmic-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            position: relative;
            z-index: 2;
        }

        .cosmic-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .cosmic-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.3) 50%,
                    transparent 100%);
            transition: left 0.5s ease;
        }

        .cosmic-btn:hover::before {
            left: 100%;
        }

        .cosmic-btn.copy {
            background: linear-gradient(45deg,
                    var(--cosmic-blue) 0%,
        var(--accent-blue) 100%);
            color: var(--text-white);
        }

        .cosmic-btn.copy:hover {
            background: linear-gradient(45deg,
        var(--accent-blue) 0%,
                    var(--cosmic-gold) 100%);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .cosmic-btn.save {
            background: linear-gradient(45deg,
                    var(--cosmic-purple) 0%,
                    var(--cosmic-pink) 100%);
            color: var(--text-white);
        }

        .cosmic-btn.save:hover {
            background: linear-gradient(45deg,
                    var(--cosmic-pink) 0%,
                    var(--cosmic-gold) 100%);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
        }

        /* ================== حالة التحميل الكونية ================== */
        .cosmic-btn.loading {
            pointer-events: none;
        }

        .cosmic-btn.loading .btn-text {
            visibility: hidden;
        }

        .cosmic-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 3px solid transparent;
            border-top-color: var(--text-white);
            border-radius: 50%;
            animation: cosmicSpin 1s linear infinite;
        }

        @keyframes cosmicSpin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* ================== النوافذ المنبثقة الكونية ================== */
        .cosmic-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: modalFadeIn 0.4s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .cosmic-modal-content {
            background: linear-gradient(135deg,
                    rgba(10, 10, 35, 0.95) 0%,
                    rgba(45, 27, 105, 0.9) 50%,
                    rgba(26, 26, 90, 0.95) 100%);
            backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: modalSlideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(50px) scale(0.9);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .cosmic-modal-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .cosmic-modal-title {
            font-family: 'Scheherazade New', serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg,
                    var(--cosmic-gold) 0%,
        var(--accent-blue) 50%,
                    var(--cosmic-pink) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: cosmicTextShimmer 3s ease-in-out infinite;
            margin-bottom: 10px;
        }

        .cosmic-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg,
                    var(--cosmic-purple) 0%,
                    var(--cosmic-pink) 100%);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: var(--text-white);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(212, 0, 255, 0.3);
        }

        .cosmic-close-btn:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 10px 30px rgba(212, 0, 255, 0.5);
        }

        /* ================== التذييل الكوني ================== */
        .cosmic-footer {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg,
                    rgba(10, 10, 35, 0.9) 0%,
                    rgba(45, 27, 105, 0.8) 100%);
            backdrop-filter: blur(20px);
            margin-top: 60px;
            border-top: 2px solid rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .cosmic-footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg,
                    rgba(255, 215, 0, 0.05) 0%,
                    transparent 25%,
                    rgba(0, 212, 255, 0.05) 50%,
                    transparent 75%,
                    rgba(212, 0, 255, 0.05) 100%);
            animation: footerShimmer 8s ease-in-out infinite;
        }

        @keyframes footerShimmer {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .cosmic-footer-text {
            font-size: 1.1rem;
            color: var(--accent-blue);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            position: relative;
            z-index: 2;
        }

        /* ================== التصميم المتجاوب - تحسينات الأداء الجذرية ================== */
        @media (max-width: 768px) {


            /* تحسين العناصر التفاعلية */
            .cosmic-title {
                font-size: 2.5rem;
                text-shadow:
                    0 0 30px rgba(255, 215, 0, 0.9),
                    0 2px 15px rgba(0, 0, 0, 0.9);
                animation-duration: 8s !important;
            }

            .cosmic-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .cosmic-dua-card {
                padding: 25px 20px;
                background: linear-gradient(135deg,
                        rgba(255, 255, 255, 0.15) 0%,
                        rgba(255, 255, 255, 0.1) 100%);
                backdrop-filter: blur(25px);
                border: 2px solid rgba(255, 215, 0, 0.4);
                animation-duration: 1.2s !important;
            }

            .cosmic-dua-text {
                font-size: 1.4rem;
                text-shadow:
                    0 2px 15px rgba(0, 0, 0, 0.9),
                    0 0 25px rgba(255, 255, 255, 0.4);
                background: rgba(0, 0, 0, 0.3);
                padding: 15px;
                border-radius: 15px;
                margin-bottom: 20px;
            }

            .cosmic-actions {
                flex-direction: column;
                gap: 10px;
            }

            .cosmic-btn {
                width: 100%;
                justify-content: center;
            }

            /* تعطيل تأثيرات التمرير المعقدة على الموبايل */
            .cosmic-dua-card:hover .cosmic-dua-text {
                animation: none !important;
            }

            /* تبسيط تأثيرات التمرير */
            .cosmic-search::before,
            .cosmic-header::before,
            .cosmic-footer::before {
                animation-duration: 15s !important;
            }
        }

        @media (max-width: 500px) {
            .cosmic-title {
                font-size: 2rem;
                text-shadow:
                    0 0 30px rgba(255, 215, 0, 0.95),
                    0 2px 15px rgba(0, 0, 0, 0.95);
            }

            .cosmic-subtitle {
                font-size: 1.1rem;
                text-shadow:
                    0 0 20px rgba(0, 255, 136, 0.9),
                    0 2px 10px rgba(0, 0, 0, 0.95);
            }

            .cosmic-search {
                margin: 0 10px 20px;
            }

            .cosmic-container {
                padding: 0 15px;
            }

            .cosmic-modal-content {
                padding: 30px 20px;
                margin: 20px;
                background: linear-gradient(135deg,
                        rgba(10, 10, 35, 0.95) 0%,
                        rgba(45, 27, 105, 0.9) 50%,
                        rgba(26, 26, 90, 0.95) 100%);
                backdrop-filter: blur(30px);
            }

            .cosmic-modal-title {
                font-size: 2rem;
                text-shadow:
                    0 0 25px rgba(255, 215, 0, 0.9),
                    0 2px 10px rgba(0, 0, 0, 0.95);
            }

            /* تحسين النص على الموبايل الصغير */
            .cosmic-dua-text {
                font-size: 1.3rem;
                text-shadow:
                    0 2px 20px rgba(0, 0, 0, 0.95),
                    0 0 30px rgba(255, 255, 255, 0.5);
                background: rgba(0, 0, 0, 0.4);
                padding: 18px;
                border-radius: 15px;
                margin-bottom: 20px;
                border: 1px solid rgba(255, 215, 0, 0.3);
            }
        }

        /* ================== تأثيرات إضافية للتفاعل ================== */
        .cosmic-dua-card:hover .cosmic-dua-text {
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {

            0%,
            100% {
                transform: scale(1);
                text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            }

            50% {
                transform: scale(1.02);
                text-shadow:
                    0 2px 10px rgba(0, 0, 0, 0.5),
                    0 0 30px rgba(255, 215, 0, 0.5);
            }
        }

        /* ================== تحسينات الأداء ================== */
        /* تحسين will-change للأداء - يتم تطبيقه فقط عند الحاجة */
        .cosmic-dua-card:hover,
        .cosmic-btn:hover,
        .cosmic-search:focus-within {
            will-change: transform;
        }

        .cosmic-dua-card,
        .cosmic-btn,
        .cosmic-search,
        .cosmic-modal-content {
            will-change: auto;
        }


        /* ================== تأثير الانطلاق عند التحميل ================== */
        .cosmic-dua-card {
            opacity: 0;
            transform: translateY(50px);
            animation: cardAppear 0.8s ease forwards;
        }

    // ================== عرض الأدعية ==================
    function displayCosmicDuas(duasToShow = cosmicDuas) {
        const container = document.getElementById('cosmic-duas-container');
        container.innerHTML = '';

        duasToShow.forEach((dua, index) => {
            const duaCard = document.createElement('div');
            duaCard.className = 'cosmic-dua-card';
            duaCard.innerHTML = `
                <div class="cosmic-dua-text">${dua.text}</div>
                <div class="cosmic-actions">
                    <button class="cosmic-btn copy" onclick="copyCosmicDua(this)">
                        <span class="btn-text">
                            <i class="fas fa-copy"></i> نسخ
                        </span>
                    </button>

                </div>
            `;
            container.appendChild(duaCard);
        });
    }

    // ================== البحث في الأدعية ==================
    function searchCosmicDuas() {
        const searchInput = document.getElementById('cosmic-search-input');
        const searchTerm = searchInput.value.trim();

        if (searchTerm === '') {
            displayCosmicDuas();
            return;
        }

        const filteredDuas = cosmicDuas.filter(dua =>
            dua.text.includes(searchTerm)
        );

        displayCosmicDuas(filteredDuas);
    }

    // ================== نسخ الدعاء ==================
    async function copyCosmicDua(button) {
        const duaCard = button.closest('.cosmic-dua-card');
        const duaText = duaCard.querySelector('.cosmic-dua-text').innerText;
        const btnText = button.querySelector('.btn-text');
        const originalHtml = btnText.innerHTML;

        button.classList.add('loading');

        try {
            await navigator.clipboard.writeText(duaText);

            button.classList.remove('loading');
            btnText.innerHTML = '<i class="fas fa-check"></i> تم النسخ';

            setTimeout(() => {
                btnText.innerHTML = originalHtml;
            }, 2000);
        } catch (err) {
            button.classList.remove('loading');
            btnText.innerHTML = '<i class="fas fa-times"></i> فشل النسخ';

            setTimeout(() => {
                btnText.innerHTML = originalHtml;
            }, 2000);
        }
    }

    // ================== حفظ الدعاء ==================
    async function saveCosmicDua(button) {
        const duaCard = button.closest('.cosmic-dua-card');
        const btnText = button.querySelector('.btn-text');
        const originalHtml = btnText.innerHTML;

        button.classList.add('loading');

        try {
            // إنشاء نسخة للحفظ
            const tempCard = duaCard.cloneNode(true);
            tempCard.style.cssText = `
                position: absolute;
                left: -9999px;
                top: -9999px;
                width: 500px;
                background: linear-gradient(135deg, #0a0a23 0%, #2d1b69 100%);
                border: 3px solid #ffd700;
                border-radius: 25px;
                padding: 40px;
            `;

            // إزالة الأزرار
            const actions = tempCard.querySelector('.cosmic-actions');
            actions.style.display = 'none';

            document.body.appendChild(tempCard);

            // التقاط الصورة
            const canvas = await html2canvas(tempCard, {
                backgroundColor: null,
                scale: 2,
                useCORS: true
            });

            // تحميل الصورة
            const link = document.createElement('a');
            link.download = 'دعاء-كوني.png';
            link.href = canvas.toDataURL('image/png');
            link.click();

            // تنظيف
            document.body.removeChild(tempCard);

            button.classList.remove('loading');
            btnText.innerHTML = '<i class="fas fa-check"></i> تم الحفظ';

            setTimeout(() => {
                btnText.innerHTML = originalHtml;
            }, 2000);

        } catch (err) {
            button.classList.remove('loading');
            btnText.innerHTML = '<i class="fas fa-times"></i> فشل الحفظ';

            setTimeout(() => {
                btnText.innerHTML = originalHtml;
            }, 2000);
        }
    }

    // ================== فتح نافذة جامع الدعاء ==================
    function openCollectiveCosmicModal() {
        const modal = document.getElementById('collective-cosmic-modal');
        const content = document.getElementById('collective-cosmic-content');

        content.innerHTML = '';

        cosmicDuas.forEach((dua, index) => {
            const duaDiv = document.createElement('div');
            duaDiv.style.cssText = `
                margin: 25px 0;
                padding: 25px;
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 215, 0, 0.3);
                border-radius: 15px;
                font-size: 1.4rem;
                line-height: 2;
                text-align: center;
                backdrop-filter: blur(10px);
            `;
            duaDiv.textContent = dua.text;
            content.appendChild(duaDiv);
        });

        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    // ================== إغلاق النوافذ المنبثقة ==================
    function closeCosmicModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
        document.body.style.overflow = 'auto';
    }


    // ================== التهيئة ==================
    document.addEventListener('DOMContentLoaded', () => {
        // عرض الأدعية مباشرة بدون التأثيرات البصرية

        // عرض الأدعية
        displayCosmicDuas();

        // معالجات الأحداث
        document.getElementById('cosmic-search-btn').addEventListener('click', searchCosmicDuas);
        document.getElementById('cosmic-search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchCosmicDuas();
        });
        document.getElementById('cosmic-search-input').addEventListener('input', searchCosmicDuas);

        document.getElementById('collective-cosmic-btn').addEventListener('click', openCollectiveCosmicModal);
        document.getElementById('collective-close-cosmic').addEventListener('click', () => {
            closeCosmicModal('collective-cosmic-modal');
        });

        // إغلاق النافذة عند الضغط خارجها
        document.getElementById('collective-cosmic-modal').addEventListener('click', (e) => {
            if (e.target.id === 'collective-cosmic-modal') {
                closeCosmicModal('collective-cosmic-modal');
            }
        });
    });
