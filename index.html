<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدعية القرآن الكريم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@200;300;400;500;600;700;800;900&family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- الهيدر -->
        <header class="cosmic-header">
            <div class="header-content">
                <button class="icon-btn settings-btn" onclick="openSettings()" aria-label="الإعدادات">
                    <i class="fas fa-cog"></i>
                </button>
                <h1 class="cosmic-title">أدعية القرآن الكريم</h1>
                <button class="icon-btn theme-btn" onclick="toggleTheme()" aria-label="تغيير الثيم">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
            </div>
            <p class="cosmic-subtitle">دعاء المؤمنين في كتاب رب العالمين</p>
            
            <!-- البحث -->
            <div class="cosmic-search">
                <input type="text" id="searchInput" placeholder="ابحث عن دعاء..." aria-label="البحث">
                <button onclick="searchDuas()" aria-label="بحث">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <!-- زر جامع الدعاء -->
            <div class="collective-prayer-section">
                <button class="collective-btn" onclick="openCollectivePrayer()">
                    <i class="fas fa-bookmark"></i>
                    <span>جامع الدعاء المحفوظ</span>
                    <span class="saved-count" id="savedCount">0</span>
                </button>
            </div>
        </header>

        <!-- محتوى الأدعية -->
        <main class="cosmic-container">
            <div class="cosmic-grid" id="duaGrid">
                <!-- سيتم ملؤها بواسطة JavaScript -->
            </div>
        </main>

        <!-- مودال تفاصيل الدعاء -->
        <div class="modal" id="duaModal">
            <div class="modal-content">
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <div class="modal-body">
                    <h2 class="dua-title" id="modalTitle"></h2>
                    <div class="dua-text-large" id="modalText"></div>
                    <div class="modal-actions">
                        <button class="action-btn copy-btn" onclick="copyDua()">
                            <i class="fas fa-copy"></i>
                            <span>نسخ</span>
                        </button>
                        <button class="action-btn save-btn" onclick="toggleSave()" id="saveBtn">
                            <i class="far fa-bookmark"></i>
                            <span>حفظ</span>
                        </button>
                        <button class="action-btn share-btn" onclick="shareDua()">
                            <i class="fas fa-share-alt"></i>
                            <span>مشاركة</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- مودال جامع الدعاء -->
        <div class="modal" id="collectiveModal">
            <div class="modal-content collective-modal">
                <div class="modal-header">
                    <button class="close-btn" onclick="closeCollectiveModal()">&times;</button>
                    <h2>جامع الدعاء المحفوظ</h2>
                </div>
                <div class="modal-body">
                    <div class="saved-duas-list" id="savedDuasList">
                        <!-- سيتم ملؤها بواسطة JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <!-- مودال الإعدادات -->
        <div class="modal" id="settingsModal">
            <div class="modal-content settings-modal">
                <div class="modal-header">
                    <button class="close-btn" onclick="closeSettings()">&times;</button>
                    <h2>الإعدادات</h2>
                </div>
                <div class="modal-body">
                    <div class="settings-group">
                        <h3><i class="fas fa-font"></i> الخط</h3>
                        <select id="fontFamily" onchange="updateSettings()">
                            <option value="'Scheherazade New', serif">شهرزاد الجديد</option>
                            <option value="'Amiri', serif">أميري</option>
                            <option value="'Cairo', sans-serif">القاهرة</option>
                        </select>
                    </div>

                    <div class="settings-group">
                        <h3><i class="fas fa-text-height"></i> حجم الخط</h3>
                        <div class="slider-container">
                            <input type="range" id="fontSize" min="16" max="32" value="20" step="1" onchange="updateSettings()">
                            <span id="fontSizeValue">20px</span>
                        </div>
                    </div>

                    <div class="settings-group">
                        <h3><i class="fas fa-palette"></i> اللون الرئيسي</h3>
                        <div class="color-picker">
                            <button class="color-option" style="background: #ffd700" onclick="setAccentColor('#ffd700')"></button>
                            <button class="color-option" style="background: #00d4ff" onclick="setAccentColor('#00d4ff')"></button>
                            <button class="color-option" style="background: #d400ff" onclick="setAccentColor('#d400ff')"></button>
                            <button class="color-option" style="background: #ff6b9d" onclick="setAccentColor('#ff6b9d')"></button>
                            <button class="color-option" style="background: #4c9a93" onclick="setAccentColor('#4c9a93')"></button>
                            <button class="color-option" style="background: #D4AF37" onclick="setAccentColor('#D4AF37')"></button>
                        </div>
                    </div>

                    <div class="settings-group">
                        <h3><i class="fas fa-adjust"></i> وضع العرض</h3>
                        <div class="toggle-group">
                            <label class="toggle-label">
                                <input type="checkbox" id="reduceMotion" onchange="updateSettings()">
                                <span>تقليل الحركة</span>
                            </label>
                        </div>
                    </div>

                    <div class="settings-actions">
                        <button class="action-btn reset-btn" onclick="resetSettings()">
                            <i class="fas fa-undo"></i>
                            <span>إعادة تعيين</span>
                        </button>
                        <button class="action-btn export-btn" onclick="exportData()">
                            <i class="fas fa-download"></i>
                            <span>تصدير البيانات</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
