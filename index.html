<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://public-frontend-cos.metadl.com/mgx/img/favicon.png" type="image/png">
    <title>أدعية وأذكار القرآن الكريم</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --bg-light: #f8f9fa;
            --bg-dark: #1a1a2e;
            --card-light: rgba(255, 255, 255, 0.95);
            --card-dark: rgba(30, 30, 46, 0.95);
            --text-light: #2d3748;
            --text-dark: #e2e8f0;
            --shadow-light: 0 10px 40px rgba(0, 0, 0, 0.1);
            --shadow-dark: 0 10px 40px rgba(0, 0, 0, 0.5);
            --accent-gold: #ffd700;
            --accent-emerald: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
            transition: all 0.3s ease;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        body.dark-mode::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px;
            background: var(--primary-gradient);
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }

        body.dark-mode .header {
            box-shadow: var(--shadow-dark);
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-tab {
            flex: 1;
            min-width: 150px;
            padding: 15px 25px;
            background: var(--card-light);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.3s ease;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }

        body.dark-mode .nav-tab {
            background: var(--card-dark);
            color: var(--text-dark);
            box-shadow: var(--shadow-dark);
        }

        .nav-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--primary-gradient);
            transition: left 0.3s ease;
            z-index: 0;
        }

        .nav-tab span {
            position: relative;
            z-index: 1;
        }

        .nav-tab:hover::before {
            left: 0;
        }

        .nav-tab:hover span {
            color: white;
        }

        .nav-tab.active {
            background: var(--primary-gradient);
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .nav-tab.active span {
            color: white;
        }

        /* Settings Bar */
        .settings-bar {
            background: var(--card-light);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-light);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        body.dark-mode .settings-bar {
            background: var(--card-dark);
            box-shadow: var(--shadow-dark);
        }

        .settings-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .settings-btn,
        .theme-toggle {
            background: var(--primary-gradient);
            color: white;
            padding: 12px 24px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            font-size: 1rem;
        }

        .settings-btn:hover,
        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        /* Settings Modal */
        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .settings-modal.active {
            display: flex;
        }

        .settings-content {
            background: var(--card-light);
            padding: 40px;
            border-radius: 25px;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-light);
            position: relative;
        }

        body.dark-mode .settings-content {
            background: var(--card-dark);
            box-shadow: var(--shadow-dark);
        }

        .settings-content h2 {
            margin-bottom: 30px;
            color: var(--text-light);
            text-align: center;
            font-size: 1.8rem;
        }

        body.dark-mode .settings-content h2 {
            color: var(--text-dark);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        body.dark-mode .close-modal {
            color: var(--text-dark);
        }

        .close-modal:hover {
            transform: scale(1.2);
            color: #667eea;
        }

        .setting-item {
            margin-bottom: 25px;
        }

        .setting-item label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-light);
            font-size: 1.1rem;
        }

        body.dark-mode .setting-item label {
            color: var(--text-dark);
        }

        .setting-item select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            background: rgba(102, 126, 234, 0.05);
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        body.dark-mode .setting-item select {
            background: rgba(102, 126, 234, 0.15);
            color: var(--text-dark);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .setting-item select:hover,
        .setting-item select:focus {
            border-color: #667eea;
            outline: none;
        }

        /* Content Section */
        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 200px;
            padding: 20px;
            background: var(--card-light);
            border-radius: 20px;
            box-shadow: var(--shadow-light);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        body.dark-mode .stat-card {
            background: var(--card-dark);
            box-shadow: var(--shadow-dark);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary-gradient);
        }

        .stat-card h3 {
            font-size: 2rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #718096;
            font-size: 0.9rem;
        }

        body.dark-mode .stat-card p {
            color: #a0aec0;
        }

        /* Dua Card */
        .dua-card {
            background: var(--card-light);
            padding: 30px;
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-light);
            position: relative;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        body.dark-mode .dua-card {
            background: var(--card-dark);
            box-shadow: var(--shadow-dark);
        }

        .dua-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .dua-card.current {
            border-color: #10b981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(16, 185, 129, 0.03) 100%);
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.2);
        }

        body.dark-mode .dua-card.current {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(16, 185, 129, 0.05) 100%);
        }

        .dua-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .dua-number {
            background: var(--primary-gradient);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .favorite-btn {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: grayscale(100%);
            opacity: 0.5;
        }

        .favorite-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .favorite-btn.active {
            filter: grayscale(0%);
            opacity: 1;
            animation: heartBeat 0.5s ease;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1.1); }
        }

        .dua-text {
            font-size: 1.3rem;
            line-height: 2.2;
            text-align: center;
            color: var(--text-light);
            padding: 20px;
            background: rgba(102, 126, 234, 0.03);
            border-radius: 15px;
            font-weight: 500;
        }

        body.dark-mode .dua-text {
            color: var(--text-dark);
            background: rgba(102, 126, 234, 0.1);
        }

        /* Font Sizes */
        body.font-small .dua-text { 
            font-size: 1.1rem; 
            line-height: 2; 
        }
        
        body.font-medium .dua-text { 
            font-size: 1.5rem; 
            line-height: 2.3; 
        }
        
        body.font-large .dua-text { 
            font-size: 1.9rem; 
            line-height: 2.6; 
        }

        /* Font Families */
        body.font-traditional { 
            font-family: 'Traditional Arabic', 'Arial', sans-serif; 
        }
        
        body.font-naskh { 
            font-family: 'Arabic Typesetting', 'Times New Roman', serif; 
        }
        
        body.font-kufi { 
            font-family: 'Simplified Arabic', 'Arial', sans-serif; 
        }
        
        body.font-modern { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        /* Filter Buttons */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 24px;
            background: var(--card-light);
            border: 2px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: var(--text-light);
            font-size: 1rem;
        }

        body.dark-mode .filter-btn {
            background: var(--card-dark);
            color: var(--text-dark);
        }

        .filter-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }

        .reset-btn {
            padding: 12px 24px;
            background: var(--secondary-gradient);
            border: 2px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: white;
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.3);
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(240, 147, 251, 0.4);
        }

        .reset-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-light);
            padding: 60px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            z-index: 2000;
            text-align: center;
            animation: scaleIn 0.5s ease;
        }

        body.dark-mode .reset-animation {
            background: var(--card-dark);
        }

        @keyframes scaleIn {
            from {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .reset-animation .icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: spin 1s ease;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .reset-animation h2 {
            color: var(--text-light);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        body.dark-mode .reset-animation h2 {
            color: var(--text-dark);
        }

        .reset-animation p {
            color: #718096;
            font-size: 1.1rem;
        }

        body.dark-mode .reset-animation p {
            color: #a0aec0;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        /* Scroll to Top Button */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 55px;
            height: 55px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .scroll-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .scroll-top.visible {
            display: flex;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: var(--accent-emerald);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-right: 10px;
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .nav-tabs {
                flex-direction: column;
            }

            .nav-tab {
                min-width: 100%;
            }

            .settings-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .settings-buttons {
                width: 100%;
                justify-content: center;
            }

            .stats-bar {
                flex-direction: column;
            }

            body.font-small .dua-text { font-size: 1rem; }
            body.font-medium .dua-text { font-size: 1.3rem; }
            body.font-large .dua-text { font-size: 1.6rem; }

            .settings-content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

                <button class="filter-btn" data-filter="unread">غير المقروءة</button>
                <button class="reset-btn" data-section="tasbih">🔄 إعادة تعيين</button>
            </div>

            <!-- Tasbih List -->
            <div id="tasbihList"></div>
        </div>

        <div id="ahmadahSection" class="content-section">
            <!-- Stats Bar -->
            <div class="stats-bar">
                <div class="stat-card">
                    <h3 id="ahmadahTotalCount">0</h3>
                    <p> الاجمالي</p>
                </div>
                <div class="stat-card">

            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">

                <button class="filter-btn" data-filter="unread">غير المقروءة</button>
                <button class="reset-btn" data-section="ahmadah">🔄 إعادة تعيين</button>

        // App State
        class AppState {
            constructor(section) {
                this.section = section;
                this.storageKey = `${section}_state`;
                this.load();
            }

            load() {
                const saved = localStorage.getItem(this.storageKey);
                if (saved) {
                    const data = JSON.parse(saved);
                    this.currentId = data.currentId || null;
                    this.readIds = new Set(data.readIds || []);
                    this.favorites = new Set(data.favorites || []);
                } else {
                    this.currentId = null;
                    this.readIds = new Set();
                    this.favorites = new Set();
                }
            }

            save() {
                localStorage.setItem(this.storageKey, JSON.stringify({
                    currentId: this.currentId,
                    readIds: Array.from(this.readIds),
                    favorites: Array.from(this.favorites)
                }));
            }

            markAsRead(id) {
                this.readIds.add(id);
                this.currentId = id;
                this.save();
            }

            toggleFavorite(id) {
                if (this.favorites.has(id)) {
                    this.favorites.delete(id);
                } else {
                    this.favorites.add(id);
                }
                this.save();
            }

            isFavorite(id) {
                return this.favorites.has(id);
            }

            isRead(id) {
                return this.readIds.has(id);
            }

            isCurrent(id) {
                return this.currentId === id;
            }

            reset() {
                this.readIds.clear();
                this.currentId = null;
                this.save();
            }
        }

        function initializeSettings() {
            // Apply saved settings
            document.body.classList.remove('font-small', 'font-medium', 'font-large');
            document.body.classList.add(`font-${fontSize}`);
            
            document.body.classList.remove('font-traditional', 'font-naskh', 'font-kufi', 'font-modern');
            document.body.classList.add(`font-${fontFamily}`);
            
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggle').textContent = '☀️ الوضع النهاري';
            }

            // Set select values
            document.getElementById('fontSizeSelect').value = fontSize;
            document.getElementById('fontFamilySelect').value = fontFamily;
        }

        function setupEventListeners() {
            // Navigation tabs
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const section = tab.dataset.section;
                    switchSection(section);

            document.getElementById('settingsBtn').addEventListener('click', () => {

            });

            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('settingsModal').classList.remove('active');
            });

            document.getElementById('settingsModal').addEventListener('click', (e) => {
                if (e.target.id === 'settingsModal') {
                    document.getElementById('settingsModal').classList.remove('active');
                }
            });

            // Font size
            document.getElementById('fontSizeSelect').addEventListener('change', (e) => {
                document.body.classList.remove('font-small', 'font-medium', 'font-large');
                fontSize = e.target.value;
                document.body.classList.add(`font-${fontSize}`);
                localStorage.setItem('fontSize', fontSize);
            });

            // Font family
            document.getElementById('fontFamilySelect').addEventListener('change', (e) => {
                document.body.classList.remove('font-traditional', 'font-naskh', 'font-kufi', 'font-modern');
                fontFamily = e.target.value;
                document.body.classList.add(`font-${fontFamily}`);
                localStorage.setItem('fontFamily', fontFamily);
            });

            // Theme toggle
            document.getElementById('themeToggle').addEventListener('click', () => {
                isDarkMode = !isDarkMode;
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', isDarkMode);
                document.getElementById('themeToggle').textContent = isDarkMode ? '☀️ الوضع النهاري' : '🌙 الوضع الليلي';
            });

            const scrollTopBtn = document.getElementById('scrollTop');

                if (window.pageYOffset > 300) {
                    scrollTopBtn.classList.add('visible');

            });

            scrollTopBtn.addEventListener('click', () => {

        function setupFilterButtons(sectionId) {
            const section = document.getElementById(sectionId);
            const filterBtns = section.querySelectorAll('.filter-btn');

                btn.addEventListener('click', () => {

                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderContent();
                });
            });
        }

        function switchSection(section) {
            currentSection = section;
            currentFilter = 'all';

            // Update tabs
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.section === section) {
                    tab.classList.add('active');
                }
            });

            // Update sections
            document.querySelectorAll('.content-section').forEach(sec => {
                sec.classList.remove('active');
            });
            document.getElementById(`${section}Section`).classList.add('active');

            // Reset filter buttons
            const activeSection = document.getElementById(`${section}Section`);
            activeSection.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filter === 'all') {
                    btn.classList.add('active');
                }
            });

            renderContent();
            updateStats();
        }

                                // Add current class to this card
                                card.classList.add('current');
                                
                                // Add badge if not exists
                                const headerDiv = card.querySelector('.dua-header > div');
                                if (!headerDiv.querySelector('.badge')) {
                                    const badge = document.createElement('span');
                                    badge.className = 'badge';
                                    badge.textContent = 'ِ*';
                                    headerDiv.appendChild(badge);
                                }
                                
                                updateStats();
                            }
                        });
                    }, { threshold: 0.5 });

                    observer.observe(card);

                    // Favorite button
                    favBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        state.toggleFavorite(item.id);
                        favBtn.classList.toggle('active');
                        favBtn.textContent = state.isFavorite(item.id) ? '⭐' : '☆';
                        updateStats();
                    });
                });

                // Scroll to current item
                if (state.currentId && currentFilter === 'all') {
                    setTimeout(() => {
                        const currentCard = document.getElementById(`card-${currentSection}-${state.currentId}`);
                        if (currentCard) {
                            currentCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 100);
                }
            }
        }

        function createCard(item, state) {
            const isFavorite = state.isFavorite(item.id);
            const isCurrent = state.isCurrent(item.id);
            
            return `
                <div class="dua-card ${isCurrent ? 'current' : ''}" id="card-${currentSection}-${item.id}">
                    <div class="dua-header">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div class="dua-number">${item.id}</div>
                            ${isCurrent ? '<span class="badge">📍 آخر قراءة</span>' : ''}
                        </div>
                        <button class="favorite-btn ${isFavorite ? 'active' : ''}">
                            ${isFavorite ? '⭐' : '☆'}
                        </button>
                    </div>
                    <div class="dua-text">${item.text}</div>
                </div>
            `;
        }

        function getData() {
            switch (currentSection) {
                case 'duas': return duasData;
                case 'tasbih': return tasbihData;
                case 'ahmadah': return ahmadahData;
                default: return [];
            }
        }

        function updateStats() {
            const data = getData();
            const state = states[currentSection];

            const totalCount = data.length;
            const readCount = state.readIds.size;
            const favCount = state.favorites.size;

            document.getElementById(`${currentSection}TotalCount`).textContent = totalCount;
            document.getElementById(`${currentSection}ReadCount`).textContent = readCount;
            document.getElementById(`${currentSection}FavCount`).textContent = favCount;
        }

        function resetProgress(section) {
            const sectionName = section === 'duas' ? 'الأدعية' : section === 'tasbih' ? 'التسبيحات' : 'الأحمدة';
            
            states[section].reset();
            
            const resetAnimation = document.createElement('div');
            resetAnimation.className = 'reset-animation';
            resetAnimation.innerHTML = `
                <div class="icon">🔄</div>
                <h2>تم إعادة التعيين بنجاح!</h2>
                <p>تم مسح جميع ${sectionName} المقروءة</p>
            `;
            document.body.appendChild(resetAnimation);

            setTimeout(() => {
                resetAnimation.remove();
                renderContent();
                updateStats();
            }, 2000);
        }
    </script>
</body>
</html>
