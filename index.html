<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدعية القرآن الكريم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@200;300;400;500;600;700;800;900&family=Scheherazade+New:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* ================== الأساسيات والمتغيرات ================== */
        :root {
            --cosmic-deep: #0a0a23;
            --cosmic-blue: #1a1a5a;
            --cosmic-purple: #2d1b69;
            --cosmic-pink: #ff6b9d;
            --cosmic-gold: #ffd700;
            --aurora-green: #00ff88;
            --aurora-blue: #00d4ff;
            --aurora-purple: #d400ff;
            --star-white: #ffffff;
            --moon-silver: #c0c0c0;
            --cloud-white: rgba(255, 255, 255, 0.8);
            --lightning-yellow: #ffff00;
            --cosmic-glow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            font-family: 'Cairo', 'Amiri', serif;
            background: var(--cosmic-deep);
            color: var(--star-white);
            position: relative;
        }

        /* Prevent horizontal scrolling with proper responsive fixes */
        .cosmic-container,
        .cosmic-grid,
        .cosmic-search,
        .cosmic-modal-content {
            max-width: 100%;
            box-sizing: border-box;
        }

        /* ================== تحسينات إمكانية الوصول ================== */
        /* تعطيل الرسوم المتحركة للمستخدمين الذين يفضلون تقليل الحركة */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }

            .cosmic-canvas,
            .star,
            .moon,
            .aurora,
            .cloud,
            .lightning,
            .particle {
                animation: none !important;
            }

            .cosmic-title,
            .cosmic-subtitle {
                background: var(--cosmic-gold) !important;
                -webkit-background-clip: unset !important;
                -webkit-text-fill-color: unset !important;
                animation: none !important;
            }
        }

        /* ================== الخلفية الكونية المتحركة ================== */
        .cosmic-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg,
                    var(--cosmic-deep) 0%,
                    var(--cosmic-blue) 25%,
                    var(--cosmic-purple) 50%,
                    #1a0040 75%,
                    var(--cosmic-deep) 100%);
            animation: cosmicShift 20s ease-in-out infinite alternate;
        }

        @keyframes cosmicShift {
            0% {
                background: linear-gradient(45deg,
                        var(--cosmic-deep) 0%,
                        var(--cosmic-blue) 25%,
                        var(--cosmic-purple) 50%,
                        #1a0040 75%,
                        var(--cosmic-deep) 100%);
            }

            50% {
                background: linear-gradient(135deg,
                        #2d1b69 0%,
                        #0a0a23 25%,
                        #4a0080 50%,
                        var(--cosmic-blue) 75%,
                        var(--cosmic-deep) 100%);
            }

            100% {
                background: linear-gradient(225deg,
                        var(--cosmic-deep) 0%,
                        #1a0040 25%,
                        var(--cosmic-purple) 50%,
                        var(--cosmic-blue) 75%,
                        var(--cosmic-deep) 100%);
            }
        }

        /* ================== النجوم المتحركة ================== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: var(--star-white);
            border-radius: 50%;
            animation: starTwinkle 3s ease-in-out infinite alternate;
        }

        .star.small {
            width: 2px;
            height: 2px;
            box-shadow: 0 0 6px var(--star-white);
        }

        .star.medium {
            width: 3px;
            height: 3px;
            box-shadow: 0 0 12px var(--star-white);
            animation-duration: 2s;
        }

        .star.large {
            width: 4px;
            height: 4px;
            box-shadow: 0 0 20px var(--cosmic-gold);
            animation-duration: 4s;
        }

        .star.constellation {
            width: 6px;
            height: 6px;
            background: var(--cosmic-gold);
            box-shadow: 0 0 30px var(--cosmic-gold);
            animation: constellationPulse 5s ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }

            100% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        @keyframes constellationPulse {

            0%,
            100% {
                opacity: 0.8;
                transform: scale(1) rotate(0deg);
                box-shadow: 0 0 30px var(--cosmic-gold);
            }

            25% {
                opacity: 1;
                transform: scale(1.5) rotate(90deg);
                box-shadow: 0 0 60px var(--cosmic-gold), 0 0 90px var(--cosmic-pink);
            }

            50% {
                opacity: 0.9;
                transform: scale(1.2) rotate(180deg);
                box-shadow: 0 0 45px var(--aurora-blue);
            }

            75% {
                opacity: 1;
                transform: scale(1.8) rotate(270deg);
                box-shadow: 0 0 75px var(--aurora-purple);
            }
        }

        /* ================== القمر والشمس ================== */
        .celestial-bodies {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .moon {
            position: absolute;
            top: 10%;
            right: 10%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%,
                    var(--star-white) 0%,
                    var(--moon-silver) 50%,
                    #999 100%);
            border-radius: 50%;
            box-shadow:
                0 0 50px rgba(255, 255, 255, 0.8),
                inset -20px -20px 0 rgba(0, 0, 0, 0.2);
            animation: moonFloat 15s ease-in-out infinite;
        }

        .moon::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 30%;
            width: 15px;
            height: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
        }

        .moon::after {
            content: '';
            position: absolute;
            bottom: 30%;
            right: 25%;
            width: 10px;
            height: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
        }

        @keyframes moonFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
                box-shadow: 0 0 50px rgba(255, 255, 255, 0.8);
            }

            25% {
                transform: translateY(-20px) rotate(90deg);
                box-shadow: 0 0 80px rgba(255, 255, 255, 1);
            }

            50% {
                transform: translateY(-30px) rotate(180deg);
                box-shadow: 0 0 100px var(--cosmic-gold);
            }

            75% {
                transform: translateY(-10px) rotate(270deg);
                box-shadow: 0 0 60px var(--aurora-blue);
            }
        }

        /* ================== الشفق القطبي ================== */
        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
            animation: auroraMove 25s ease-in-out infinite;
        }

        .aurora::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg,
                    transparent 0%,
                    var(--aurora-green) 20%,
                    transparent 40%,
                    var(--aurora-blue) 60%,
                    transparent 80%,
                    var(--aurora-purple) 90%,
                    transparent 100%);
            filter: blur(3px);
            animation: auroraWave 12s ease-in-out infinite alternate;
        }

        .aurora::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(0, 255, 136, 0.3) 25%,
                    rgba(0, 212, 255, 0.3) 50%,
                    rgba(212, 0, 255, 0.3) 75%,
                    transparent 100%);
            filter: blur(5px);
            animation: auroraWave2 18s ease-in-out infinite alternate-reverse;
        }

        @keyframes auroraMove {

            0%,
            100% {
                transform: translateX(0) skew(0deg, 2deg);
            }

            25% {
                transform: translateX(50px) skew(2deg, 0deg);
            }

            50% {
                transform: translateX(-30px) skew(-1deg, 3deg);
            }

            75% {
                transform: translateX(20px) skew(1deg, -1deg);
            }
        }

        @keyframes auroraWave {
            0% {
                opacity: 0.3;
                transform: scaleY(1) rotate(0deg);
            }

            50% {
                opacity: 0.8;
                transform: scaleY(1.5) rotate(1deg);
            }

            100% {
                opacity: 0.4;
                transform: scaleY(0.8) rotate(-1deg);
            }
        }

        @keyframes auroraWave2 {
            0% {
                opacity: 0.4;
                transform: scaleX(1) rotate(0deg);
            }

            50% {
                opacity: 0.7;
                transform: scaleX(1.2) rotate(-1deg);
            }

            100% {
                opacity: 0.3;
                transform: scaleX(0.9) rotate(1deg);
            }
        }

        /* ================== السحب المتحركة ================== */
        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: var(--cloud-white);
            border-radius: 50px;
            opacity: 0.4;
            animation: cloudFloat 30s linear infinite;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: var(--cloud-white);
            border-radius: 50px;
        }

        .cloud.cloud1 {
            width: 100px;
            height: 40px;
            top: 20%;
            left: -10%;
            animation-duration: 25s;
        }

        .cloud.cloud1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud.cloud1::after {
            width: 60px;
            height: 30px;
            top: -15px;
            right: 10px;
        }

        .cloud.cloud2 {
            width: 80px;
            height: 30px;
            top: 40%;
            left: -8%;
            animation-duration: 35s;
            animation-delay: -10s;
        }

        .cloud.cloud2::before {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 15px;
        }

        .cloud.cloud2::after {
            width: 50px;
            height: 25px;
            top: -10px;
            right: 15px;
        }

        .cloud.cloud3 {
            width: 120px;
            height: 50px;
            top: 15%;
            left: -12%;
            animation-duration: 40s;
            animation-delay: -20s;
        }

        .cloud.cloud3::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 20px;
        }

        .cloud.cloud3::after {
            width: 70px;
            height: 35px;
            top: -20px;
            right: 20px;
        }

        @keyframes cloudFloat {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(calc(100vw + 200px));
            }
        }

        /* ================== البرق والرعد ================== */
        .lightning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0;
            animation: lightningStrike 10s ease-in-out infinite;
        }

        .lightning::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 30%;
            width: 3px;
            height: 40%;
            background: linear-gradient(to bottom,
                    var(--lightning-yellow) 0%,
                    transparent 20%,
                    var(--lightning-yellow) 30%,
                    transparent 50%,
                    var(--lightning-yellow) 60%,
                    transparent 80%,
                    var(--lightning-yellow) 100%);
            box-shadow: 0 0 20px var(--lightning-yellow);
            transform: rotate(15deg);
        }

        .lightning::after {
            content: '';
            position: absolute;
            top: 15%;
            right: 40%;
            width: 2px;
            height: 35%;
            background: linear-gradient(to bottom,
                    var(--lightning-yellow) 0%,
                    transparent 25%,
                    var(--lightning-yellow) 40%,
                    transparent 65%,
                    var(--lightning-yellow) 100%);
            box-shadow: 0 0 15px var(--lightning-yellow);
            transform: rotate(-20deg);
        }

        @keyframes lightningStrike {

            0%,
            85%,
            100% {
                opacity: 0;
            }

            87%,
            89%,
            91% {
                opacity: 1;
                box-shadow: 0 0 100px var(--lightning-yellow);
            }

            88%,
            90% {
                opacity: 0;
            }
        }

        /* ================== نظام الجسيمات ================== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--cosmic-gold);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--cosmic-gold);
            animation: particleFloat 15s linear infinite;
        }

        .particle.energy {
            background: var(--aurora-green);
            box-shadow: 0 0 10px var(--aurora-green);
            animation-duration: 20s;
        }

        .particle.magic {
            background: var(--cosmic-pink);
            box-shadow: 0 0 8px var(--cosmic-pink);
            animation-duration: 12s;
        }

        .particle.cosmic {
            background: var(--aurora-purple);
            box-shadow: 0 0 12px var(--aurora-purple);
            animation-duration: 18s;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) translateX(200px) rotate(360deg);
                opacity: 0;
            }
        }

        /* ================== الهيدر الكوني ================== */
        .cosmic-header {
            position: relative;
            background: linear-gradient(135deg,
                    rgba(10, 10, 35, 0.9) 0%,
                    rgba(45, 27, 105, 0.8) 50%,
                    rgba(26, 26, 90, 0.9) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding: 30px 20px;
            text-align: center;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .cosmic-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><g fill="none" fill-rule="evenodd"><g fill="%23ffffff" fill-opacity="0.05"><circle cx="30" cy="30" r="2"/></g></svg>');
            animation: patternMove 20s linear infinite;
        }

        @keyframes patternMove {
            0% {
                transform: translateX(0) translateY(0);
            }

            100% {
                transform: translateX(60px) translateY(60px);
            }
        }

        .cosmic-title {
            font-family: 'Scheherazade New', 'Amiri', serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(45deg,
                    var(--cosmic-gold) 0%,
                    var(--star-white) 25%,
                    var(--aurora-blue) 50%,
                    var(--cosmic-pink) 75%,
                    var(--cosmic-gold) 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: cosmicTextShimmer 4s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        @keyframes cosmicTextShimmer {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .cosmic-subtitle {
            font-size: 1.3rem;
            color: var(--aurora-blue);
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            animation: subtitleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes subtitleGlow {
            0% {
                color: var(--aurora-blue);
                text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            }

            100% {
                color: var(--aurora-green);
                text-shadow: 0 0 20px rgba(0, 255, 136, 0.7);
            }
        }

        /* ================== البحث الكوني ================== */
        .cosmic-search {
            position: relative;
            max-width: 600px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            padding: 8px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .cosmic-search::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 215, 0, 0.2) 50%,
                    transparent 100%);
            animation: searchShimmer 3s ease-in-out infinite;
        }

        @keyframes searchShimmer {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .cosmic-search input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
            background: transparent;
            color: var(--star-white);
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif;
            outline: none;
            position: relative;
            z-index: 2;
        }

        .cosmic-search input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .cosmic-search button {
            padding: 12px 25px;
            background: linear-gradient(45deg,
                    var(--cosmic-gold) 0%,
                    var(--aurora-blue) 100%);
            border: none;
            border-radius: 50px;
            color: var(--star-white);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .cosmic-search button:hover {
            background: linear-gradient(45deg,
                    var(--aurora-green) 0%,
                    var(--cosmic-pink) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
        }

        /* ================== زر جامع الدعاء الكوني ================== */
        .collective-prayer-cosmic {
            text-align: center;
            margin-top: 20px;
        }

        .collective-btn-cosmic {
            padding: 15px 40px;
            background: linear-gradient(135deg,
                    var(--cosmic-purple) 0%,
                    var(--aurora-purple) 50%,
                    var(--cosmic-pink) 100%);
            border: none;
            border-radius: 30px;
            color: var(--star-white);
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow:
                0 8px 30px rgba(212, 0, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .collective-btn-cosmic::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.3) 50%,
                    transparent 100%);
            transition: left 0.5s ease;
        }

        .collective-btn-cosmic:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow:
                0 15px 50px rgba(212, 0, 255, 0.6),
                0 0 40px rgba(255, 107, 157, 0.5);
            background: linear-gradient(135deg,
                    var(--aurora-purple) 0%,
                    var(--cosmic-pink) 50%,
                    var(--cosmic-gold) 100%);
        }

        .collective-btn-cosmic:hover::before {
            left: 100%;
        }

        /* ================== الحاوي الرئيسي ================== */
        .cosmic-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            position: relative;
        }

        /* ================== شبكة البطاقات الكونية ================== */
        .cosmic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        /* ================== بطاقة الدعاء الكونية ================== */
        .cosmic-dua-card {
            position: relative;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.1) 0%,
                    rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 25px;
            padding: 30px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 30px rgba(255, 215, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            cursor: pointer;
        }

        .cosmic-dua-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg,
                    rgba(255, 215, 0, 0.1) 0%,
                    transparent 25%,
                    rgba(0, 212, 255, 0.1) 50%,
                    transparent 75%,
                    rgba(212, 0, 255, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .cosmic-dua-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.4),
                0 0 50px rgba(255, 215, 0, 0.3),

            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.3) 50%,
                    transparent 100%);
            transition: left 0.5s ease;

            left: 100%;

            background: linear-gradient(45deg,
                    var(--cosmic-blue) 0%,
                    var(--aurora-blue) 100%);

        .cosmic-btn.copy:hover {
            background: linear-gradient(45deg,
                    var(--aurora-blue) 0%,
                    var(--cosmic-gold) 100%);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);

        .cosmic-btn.save {
            background: linear-gradient(45deg,
                    var(--cosmic-purple) 0%,
                    var(--cosmic-pink) 100%);

        .cosmic-btn.save:hover {
            background: linear-gradient(45deg,

                    var(--cosmic-gold) 100%);

            left: 50%;

            height: 20px;

                transform: translate(-50%, -50%) rotate(360deg);

        /* ================== النوافذ المنبثقة الكونية ================== */

        /* ================== التذييل الكوني ================== */

            text-align: center;

            top: 0;
            left: 0;

            height: 100%;

                    rgba(255, 215, 0, 0.05) 0%,
                    transparent 25%,

            100% {

        .cosmic-footer-text {

        }

        /* ================== التصميم المتجاوب - تحسينات الأداء الجذرية ================== */
        @media (max-width: 768px) {

            /* تعطيل الرسوم المتحركة المعقدة على الموبايل */

            }

            /* تعطيل البرق تماماً على الموبايل */

            }

            .cosmic-title {

            .cosmic-dua-card {

            }

            .cosmic-dua-card:hover .cosmic-dua-text {
                animation: none !important;
            }

            /* تبسيط تأثيرات التمرير */
            .cosmic-search::before,
            .cosmic-header::before,
            .cosmic-footer::before {
                animation-duration: 15s !important;
            }
        }

        @media (max-width: 500px) {

            .cosmic-subtitle {

            }

            .cosmic-modal-title {
                font-size: 2rem;
                text-shadow:
                    0 0 25px rgba(255, 215, 0, 0.9),

            /* تحسين النص على الموبايل الصغير */
            .cosmic-dua-text {
                font-size: 1.3rem;
                text-shadow:
                    0 2px 20px rgba(0, 0, 0, 0.95),

        /* ================== تأثيرات إضافية للتفاعل ================== */
        .cosmic-dua-card:hover .cosmic-dua-text {

        }

        @keyframes textPulse {

            100% {

            }

            50% {

        /* ================== تحسينات الأداء ================== */

        .cosmic-dua-card:hover,
        .cosmic-btn:hover,
        .cosmic-search:focus-within {
            will-change: transform;
        }

        .cosmic-dua-card,
        .cosmic-btn,
        .cosmic-search,
        .cosmic-modal-content {
            will-change: auto;
        }

        /* ================== تأثيرات التمرير ================== */
        .parallax-star {
            position: fixed;
            pointer-events: none;

        .cosmic-dua-card {

            animation-delay: 0.4s;
        }

            animation-delay: 0.5s;
        }

        .cosmic-dua-card:nth-child(6) {
            animation-delay: 0.6s;
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

        // ================== إنشاء النجوم مع تحسينات الأداء ==================
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const isMobile = window.innerWidth <= 768;
            const isSmallMobile = window.innerWidth <= 500;

            // تقليل جذري لعدد النجوم على الموبايل
            let starCount;
            if (isSmallMobile) {
                starCount = 50; // أقل للموبايل الصغير
            } else if (isMobile) {
                starCount = 80; // تقليل إضافي للموبايل
            } else {
                starCount = 200; // العدد الكامل للكمبيوتر
            }

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                // أنواع مختلفة من النجوم - تقليل الأنواع المعقدة على الموبايل
                const types = isMobile ?
                    ['small', 'medium'] : // أنواع مبسطة للموبايل
                    ['small', 'medium', 'large', 'constellation'];
                const randomType = types[Math.floor(Math.random() * types.length)];
                star.classList.add(randomType);

                // موضع عشوائي
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';

                // تأخير عشوائي للرسوم المتحركة
                star.style.animationDelay = Math.random() * (isMobile ? 8 : 5) + 's';

                // تحسين الأداء على الموبايل
                if (isMobile) {
                    star.style.willChange = 'auto';
                }

                starsContainer.appendChild(star);
            }
        }

        // ================== إنشاء نظام الجسيمات مع تحسينات الأداء ==================
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const isMobile = window.innerWidth <= 768;
            const isSmallMobile = window.innerWidth <= 500;

            // تقليل جذري لعدد الجسيمات على الموبايل
            let particleCount;
            if (isSmallMobile) {
                particleCount = 10; // أقل للموبايل الصغير
            } else if (isMobile) {
                particleCount = 15; // تقليل إضافي للموبايل
            } else {
                particleCount = 50; // العدد الكامل للكمبيوتر
            }

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                // أنواع مختلفة من الجسيمات - تبسيط على الموبايل
                const types = isMobile ?
                    ['', 'energy'] : // أنواع مبسطة للموبايل
                    ['', 'energy', 'magic', 'cosmic'];
                const randomType = types[Math.floor(Math.random() * types.length)];
                if (randomType) particle.classList.add(randomType);

                // موضع عشوائي
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = '100%';

                // تأخير عشوائي - أبطأ على الموبايل
                particle.style.animationDelay = Math.random() * (isMobile ? 30 : 20) + 's';

                // مدة عشوائية - أبطأ على الموبايل
                const baseDuration = isMobile ? 20 : 10;
                const duration = (Math.random() * 10 + baseDuration) + 's';
                particle.style.animationDuration = duration;

                // تحسين الأداء على الموبايل
                if (isMobile) {
                    particle.style.willChange = 'auto';
                    particle.style.opacity = '0.7';
                }

                particlesContainer.appendChild(particle);
            }
        }

        // ================== عرض الأدعية ==================
        function displayCosmicDuas(duasToShow = cosmicDuas) {
            const container = document.getElementById('cosmic-duas-container');
            container.innerHTML = '';

            duasToShow.forEach((dua, index) => {
                const duaCard = document.createElement('div');
                duaCard.className = 'cosmic-dua-card';
                duaCard.innerHTML = `
                    <div class="cosmic-dua-text">${dua.text}</div>
                    <div class="cosmic-actions">
                        <button class="cosmic-btn copy" onclick="copyCosmicDua(this)">
                            <span class="btn-text">
                                <i class="fas fa-copy"></i> نسخ
                            </span>
                        </button>
                        <button class="cosmic-btn save" onclick="saveCosmicDua(this)">
                            <span class="btn-text">
                                <i class="fas fa-save"></i> حفظ
                            </span>
                        </button>
                    </div>
                `;
                container.appendChild(duaCard);
            });
        }

        // ================== البحث في الأدعية ==================
        function searchCosmicDuas() {
            const searchInput = document.getElementById('cosmic-search-input');
            const searchTerm = searchInput.value.trim();

            if (searchTerm === '') {
                displayCosmicDuas();
                return;
            }

            const filteredDuas = cosmicDuas.filter(dua =>
                dua.text.includes(searchTerm)
            );

            displayCosmicDuas(filteredDuas);
        }

        // ================== نسخ الدعاء ==================
        async function copyCosmicDua(button) {
            const duaCard = button.closest('.cosmic-dua-card');
            const duaText = duaCard.querySelector('.cosmic-dua-text').innerText;
            const btnText = button.querySelector('.btn-text');
            const originalHtml = btnText.innerHTML;

            button.classList.add('loading');

            try {
                await navigator.clipboard.writeText(duaText);

                button.classList.remove('loading');
                btnText.innerHTML = '<i class="fas fa-check"></i> تم النسخ';

                setTimeout(() => {
                    btnText.innerHTML = originalHtml;
                }, 2000);
            } catch (err) {
                button.classList.remove('loading');
                btnText.innerHTML = '<i class="fas fa-times"></i> فشل النسخ';

                setTimeout(() => {
                    btnText.innerHTML = originalHtml;
                }, 2000);
            }
        }

        // ================== حفظ الدعاء ==================
        async function saveCosmicDua(button) {
            const duaCard = button.closest('.cosmic-dua-card');
            const btnText = button.querySelector('.btn-text');
            const originalHtml = btnText.innerHTML;

            button.classList.add('loading');

            try {
                // إنشاء نسخة للحفظ
                const tempCard = duaCard.cloneNode(true);
                tempCard.style.cssText = `
                    position: absolute;
                    left: -9999px;
                    top: -9999px;
                    width: 500px;
                    background: linear-gradient(135deg, #0a0a23 0%, #2d1b69 100%);
                    border: 3px solid #ffd700;
                    border-radius: 25px;
                    padding: 40px;
                `;

                // إزالة الأزرار
                const actions = tempCard.querySelector('.cosmic-actions');
                actions.style.display = 'none';

                document.body.appendChild(tempCard);

                // التقاط الصورة
                const canvas = await html2canvas(tempCard, {
                    backgroundColor: null,
                    scale: 2,
                    useCORS: true
                });

                // تحميل الصورة
                const link = document.createElement('a');
                link.download = 'دعاء-كوني.png';
                link.href = canvas.toDataURL('image/png');
                link.click();

                // تنظيف
                document.body.removeChild(tempCard);

                button.classList.remove('loading');
                btnText.innerHTML = '<i class="fas fa-check"></i> تم الحفظ';

                setTimeout(() => {
                    btnText.innerHTML = originalHtml;
                }, 2000);

            } catch (err) {
                button.classList.remove('loading');
                btnText.innerHTML = '<i class="fas fa-times"></i> فشل الحفظ';

                setTimeout(() => {
                    btnText.innerHTML = originalHtml;
                }, 2000);
            }
        }

        // ================== فتح نافذة جامع الدعاء ==================
        function openCollectiveCosmicModal() {
            const modal = document.getElementById('collective-cosmic-modal');
            const content = document.getElementById('collective-cosmic-content');

            content.innerHTML = '';

            cosmicDuas.forEach((dua, index) => {
                const duaDiv = document.createElement('div');
                duaDiv.style.cssText = `
                    margin: 25px 0;
                    padding: 25px;
                    background: rgba(255, 255, 255, 0.1);
                    border: 1px solid rgba(255, 215, 0, 0.3);
                    border-radius: 15px;
                    font-size: 1.4rem;
                    line-height: 2;
                    text-align: center;
                    backdrop-filter: blur(10px);
                `;
                duaDiv.textContent = dua.text;
                content.appendChild(duaDiv);
            });

            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        // ================== إغلاق النوافذ المنبثقة ==================
        function closeCosmicModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // ================== تأثيرات التفاعل مع الماوس ==================
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            // تحريك النجوم
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                const speed = (index % 3 + 1) * 0.5;
                const x = (mouseX - 0.5) * speed;
                const y = (mouseY - 0.5) * speed;
                star.style.transform = `translate(${x}px, ${y}px)`;
            });

            // تحريك القمر
            const moon = document.querySelector('.moon');
            if (moon) {
                const x = (mouseX - 0.5) * 10;
                const y = (mouseY - 0.5) * 10;
                moon.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

        // ================== التهيئة ==================
        document.addEventListener('DOMContentLoaded', () => {
            // إنشاء العناصر المتحركة
            createStars();
            createParticles();

            // عرض الأدعية
            displayCosmicDuas();

            // معالجات الأحداث
            document.getElementById('cosmic-search-btn').addEventListener('click', searchCosmicDuas);
            document.getElementById('cosmic-search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchCosmicDuas();
            });
            document.getElementById('cosmic-search-input').addEventListener('input', searchCosmicDuas);

            document.getElementById('collective-cosmic-btn').addEventListener('click', openCollectiveCosmicModal);
            document.getElementById('collective-close-cosmic').addEventListener('click', () => {
                closeCosmicModal('collective-cosmic-modal');
            });

            // إغلاق النافذة عند الضغط خارجها
            document.getElementById('collective-cosmic-modal').addEventListener('click', (e) => {
                if (e.target.id === 'collective-cosmic-modal') {
                    closeCosmicModal('collective-cosmic-modal');
                }
            });
        });
    </script>
