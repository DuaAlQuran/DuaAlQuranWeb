<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامع الدعاء - أدعية القرآن الكريم</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@200;300;400;500;600;700;800;900&family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ecda",
                        "background-light": "#f6f8f8",
                        "background-dark": "#102220",
                        "teal-highlight-light": "#B2DFDB",
                        "teal-highlight-dark": "#004D40",
                        "text-light": "#333333",
                        "text-dark": "#E0E0E0"
                    },
                    fontFamily: {
                        "display": ["Manrope", "Noto Sans Arabic", "sans-serif"],
                        "arabic": ["Scheherazade New", "Amiri", "Cairo", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
        .header-hidden {
            transform: translateY(-100%);
            opacity: 0;
        }
        .top-bar {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }
        #searchBar.header-hidden {
            transform: translateY(-200%);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
    <div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
        
        <!-- Top App Bar -->
        <div id="topBar" class="top-bar sticky top-0 z-10 flex items-center justify-between bg-background-light/80 dark:bg-background-dark/80 p-4 pb-3 backdrop-blur-sm">
            <div class="flex size-12 shrink-0 items-center">
                <button onclick="openSettings()" class="flex h-12 min-w-0 cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-lg bg-transparent p-0 text-base font-bold leading-normal tracking-[0.015em] text-text-light dark:text-text-dark">
                    <span class="material-symbols-outlined text-2xl">settings</span>
                </button>
            </div>
            <h1 class="flex-1 text-center text-xl font-bold leading-tight tracking-[-0.015em] text-text-light dark:text-text-dark">أدعية القرآن الكريم</h1>
            <div class="flex w-12 items-center justify-end">
                <button onclick="toggleTheme()" class="flex h-12 min-w-0 cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-lg bg-transparent p-0 text-base font-bold leading-normal tracking-[0.015em] text-text-light dark:text-text-dark">
                    <span class="material-symbols-outlined text-2xl" id="themeIcon">dark_mode</span>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div id="searchBar" class="top-bar sticky top-[68px] z-10 bg-background-light/80 dark:bg-background-dark/80 p-4 pt-0 backdrop-blur-sm">
            <div class="flex items-center gap-2 rounded-lg bg-white dark:bg-white/5 px-4 py-2">
                <span class="material-symbols-outlined text-2xl text-gray-500 dark:text-gray-400">search</span>
                <input type="text" id="searchInput" placeholder="ابحث عن دعاء..." class="flex-1 bg-transparent border-none outline-none text-base font-normal leading-normal text-text-light dark:text-text-dark placeholder-gray-500 dark:placeholder-gray-400">
            </div>
        </div>

        <!-- Floating Action Button - Jami' Ad-Du'a -->
        <button onclick="openJamiDua()" class="fixed bottom-6 left-6 z-20 flex items-center gap-3 rounded-full bg-primary px-6 py-4 shadow-lg hover:shadow-xl transition-all">
            <span class="material-symbols-outlined text-2xl text-background-dark">book</span>
            <span class="text-base font-bold text-background-dark">جامع الدعاء</span>
            <span id="savedCountBadge" class="bg-background-dark/20 px-3 py-1 rounded-full text-sm font-bold text-background-dark">0</span>
        </button>

        <!-- Main Content - Duas List -->
        <div id="duasContainer" class="flex flex-col gap-2 p-4 pt-2">
            <!-- Duas will be rendered here -->
        </div>

        <!-- Modal for Jami' Ad-Du'a (All Duas) -->
        <div id="jamiModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
            <div class="flex items-center justify-center min-h-screen p-4">
                <div class="bg-background-light dark:bg-background-dark rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col">
                    <!-- Modal Header -->
                    <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
                        <h2 class="text-2xl font-bold text-text-light dark:text-text-dark">جامع الدعاء</h2>
                        <button onclick="closeJamiModal()" class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-white/10">
                            <span class="material-symbols-outlined text-2xl">close</span>
                        </button>
                    </div>
                    <!-- Modal Body -->
                    <div id="jamiDuasList" class="flex-1 overflow-y-auto p-4">
                        <!-- All duas will be rendered here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm">
            <div class="flex items-center justify-center min-h-screen p-4">
                <div class="bg-background-light dark:bg-background-dark rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col">
                    <!-- Modal Header -->
                    <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
                        <h2 class="text-2xl font-bold text-text-light dark:text-text-dark">الإعدادات</h2>
                        <button onclick="closeSettings()" class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-white/10">
                            <span class="material-symbols-outlined text-2xl">close</span>
                        </button>
                    </div>
                    <!-- Modal Body -->
                    <div class="p-6 space-y-6">
                        <!-- Font Family -->
                        <div>
                            <label class="block text-base font-bold mb-2 text-text-light dark:text-text-dark">نوع الخط</label>
                            <select id="fontFamily" onchange="updateSettings()" class="w-full p-3 rounded-lg bg-white dark:bg-white/5 border border-gray-300 dark:border-gray-600 text-text-light dark:text-text-dark">
                                <option value="'Scheherazade New', serif">شهرزاد الجديد</option>
                                <option value="'Amiri', serif">أميري</option>
                                <option value="'Cairo', sans-serif">القاهرة</option>
                            </select>
                        </div>
                        
                        <!-- Font Size -->
                        <div>
                            <label class="block text-base font-bold mb-2 text-text-light dark:text-text-dark">حجم الخط: <span id="fontSizeValue">18px</span></label>
                            <input type="range" id="fontSize" min="14" max="28" value="18" step="1" onchange="updateSettings()" class="w-full">
                        </div>

                        <!-- Reduce Motion -->
                        <div class="flex items-center justify-between">
                            <label class="text-base font-bold text-text-light dark:text-text-dark">تقليل الحركة</label>
                            <input type="checkbox" id="reduceMotion" onchange="updateSettings()" class="w-12 h-6">
                        </div>

                        <!-- Export Data -->
                        <button onclick="exportData()" class="w-full flex items-center justify-center gap-2 p-4 rounded-lg bg-primary text-background-dark font-bold hover:opacity-90 transition-opacity">
                            <span class="material-symbols-outlined">download</span>
                            <span>تصدير البيانات</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
